name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mycelium_tracker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mycelium_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=mycelium_tracker_test;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EcoMyceliumTracker.sln --locked-mode

      - name: Check formatting
        run: dotnet format EcoMyceliumTracker.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build EcoMyceliumTracker.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EcoMyceliumTracker.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        run: dotnet list EcoMyceliumTracker/EcoMyceliumTracker.csproj package --vulnerable --include-transitive
