services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mycelium_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mycelium_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgresConnection: Host=postgres;Port=5432;Database=mycelium_tracker;Username=postgres;Password=postgres
      Authentication__ApiKey: ${API_KEY:-local-development-api-key}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "5236:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
